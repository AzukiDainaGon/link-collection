<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>
<style>
  :root {
    --face: #c0c0c0;
    --face-light: #dfdfdf;
    --hl: #ffffff;
    --shadow: #808080;
    --dark: #000000;
    --title: #000080;
    --title2: #1084d0;
    --text: #000000;
    --desktop: #008080;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "MS Sans Serif", "MS PGothic", "Hiragino Kaku Gothic ProN", Tahoma, sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--desktop);
    min-height: 100vh;
    padding: 24px 12px 48px;
    -webkit-font-smoothing: none;
  }

  .window {
    max-width: 760px;
    margin: 0 auto;
    padding: 3px;
    background: var(--face);
    border: 2px solid;
    border-color: var(--hl) var(--dark) var(--dark) var(--hl);
    box-shadow: inset 1px 1px 0 var(--face-light), inset -1px -1px 0 var(--shadow);
  }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 2px 2px 5px;
    margin-bottom: 3px;
    background: linear-gradient(90deg, var(--title), var(--title2));
    color: #fff;
    font-weight: bold;
    font-size: 12px;
  }

  .titlebar-buttons {
    display: flex;
    gap: 2px;
  }

  .tb-btn {
    width: 18px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--face);
    color: #000;
    font-size: 10px;
    font-weight: bold;
    border: 1px solid;
    border-color: var(--hl) var(--dark) var(--dark) var(--hl);
    box-shadow: inset 1px 1px 0 var(--face-light), inset -1px -1px 0 var(--shadow);
  }

  .window-body {
    padding: 8px 12px 16px;
  }

  header {
    text-align: center;
    margin: 12px 0 24px;
  }

  h1 {
    font-size: clamp(1.4rem, 5vw, 1.9rem);
    font-weight: bold;
    letter-spacing: 0.02em;
    color: var(--title);
  }

  header p {
    margin-top: 8px;
    color: #404040;
    font-size: 12px;
  }

  main {
    max-width: 100%;
  }

  section {
    margin-bottom: 24px;
  }

  h2 {
    display: inline-block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 12px;
    padding: 4px 14px;
    background: var(--face);
    border: 2px solid;
    border-color: var(--hl) var(--dark) var(--dark) var(--hl);
    box-shadow: inset 1px 1px 0 var(--face-light), inset -1px -1px 0 var(--shadow);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }

  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 96px;
    padding: 16px 12px;
    background: var(--face);
    border: 2px solid;
    border-color: var(--hl) var(--dark) var(--dark) var(--hl);
    box-shadow: inset 1px 1px 0 var(--face-light), inset -1px -1px 0 var(--shadow);
    text-decoration: none;
    color: var(--text);
    font-weight: bold;
    font-size: 13px;
    text-align: center;
    word-break: break-word;
    -webkit-tap-highlight-color: transparent;
  }

  a.card:hover,
  a.card:focus-visible {
    background: #d4d0c8;
  }

  a.card:active {
    border-color: var(--dark) var(--hl) var(--hl) var(--dark);
    box-shadow: inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--face-light);
    transform: translate(1px, 1px);
  }

  a.card .icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  a.card .host {
    font-size: 11px;
    font-weight: normal;
    color: #404040;
  }

  footer {
    text-align: center;
    margin-top: 32px;
    color: #404040;
    font-size: 11px;
  }

  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span>My Links</span>
      <div class="titlebar-buttons">
        <span class="tb-btn">_</span>
        <span class="tb-btn">□</span>
        <span class="tb-btn">×</span>
      </div>
    </div>
    <div class="window-body">
      <header>
        <h1>My Links</h1>
        <p>よく使うサイトをまとめました</p>
      </header>

      <main>
        <section>
          <h2>学習</h2>
          <div class="grid">
            <a class="card" href="https://example.com" target="_blank" rel="noopener">
              <span class="icon">📚</span>
              創理
              <span class="host">example.com</span>
            </a>
          </div>
        </section>

        <section>
          <h2>よく使うツール</h2>
          <div class="grid">
            <a class="card" href="https://mail.google.com" target="_blank" rel="noopener">
              <span class="icon">✉️</span>
              Gmail
              <span class="host">mail.google.com</span>
            </a>
            <a class="card" href="https://www.yahoo.co.jp/" target="_blank" rel="noopener">
              <span class="icon">🔍</span>
              Yahoo
              <span class="host">yahoo.co.jp</span>
            </a>
          </div>
        </section>

        <section>
          <h2>SNS</h2>
          <div class="grid">
            <a class="card" href="https://x.com" target="_blank" rel="noopener">
              <span class="icon">🐦</span>
              X
              <span class="host">x.com</span>
            </a>
          </div>
        </section>
      </main>

      <footer>&copy; My Links</footer>
    </div>
  </div>
</body>
</html>
