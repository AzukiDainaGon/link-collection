<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>
<style>
  :root {
    --bg: #fff7f0;
    --text: #3a2e39;
    --muted: #8a7d86;
    --card: #ffffff;
    --shadow: rgba(58, 46, 57, 0.12);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, #ffe9d6 0%, #ffd9ec 45%, #d6e8ff 100%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 28px 16px 56px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  h1 {
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    letter-spacing: 0.02em;
    color: #ff5c8a;
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(255, 92, 138, 0.25);
  }

  header p {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
  }

  section {
    margin-bottom: 36px;
  }

  h2 {
    display: inline-block;
    font-size: 1.15rem;
    margin-bottom: 16px;
    padding: 6px 16px;
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(135deg, #ff8fb1, #ff5c8a);
    box-shadow: 0 4px 12px rgba(255, 92, 138, 0.35);
  }

  section:nth-of-type(2) h2 { background: linear-gradient(135deg, #7fc8ff, #4a9dff); box-shadow: 0 4px 12px rgba(74, 157, 255, 0.35); }
  section:nth-of-type(3) h2 { background: linear-gradient(135deg, #ffd76b, #ffb02e); box-shadow: 0 4px 12px rgba(255, 176, 46, 0.35); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }

  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 112px;
    padding: 20px 12px;
    background: var(--card);
    border-radius: 22px;
    text-decoration: none;
    color: var(--text);
    font-weight: 700;
    font-size: 1rem;
    text-align: center;
    word-break: break-word;
    box-shadow: 0 8px 20px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  a.card:hover,
  a.card:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 14px 26px rgba(58, 46, 57, 0.2);
  }

  a.card:active {
    transform: translateY(-1px) scale(0.98);
  }

  a.card .icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    font-size: 1.3rem;
    background: linear-gradient(135deg, #ffe9d6, #ffd9ec);
  }

  a.card .host {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
  }

  footer {
    text-align: center;
    margin-top: 44px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
</style>
</head>
<body>
  <header>
    <h1>My Links</h1>
    <p>よく使うサイトをまとめました</p>
  </header>

  <main>
    <section>
      <h2>学習</h2>
      <div class="grid">
        <a class="card" href="https://example.com" target="_blank" rel="noopener">
          <span class="icon">📚</span>
          創理
          <span class="host">example.com</span>
        </a>
      </div>
    </section>

    <section>
      <h2>よく使うツール</h2>
      <div class="grid">
        <a class="card" href="https://mail.google.com" target="_blank" rel="noopener">
          <span class="icon">✉️</span>
          Gmail
          <span class="host">mail.google.com</span>
        </a>
        <a class="card" href="https://www.youtube.com" target="_blank" rel="noopener">
          <span class="icon">▶️</span>
          YouTube
          <span class="host">youtube.com</span>
        </a>
      </div>
    </section>

    <section>
      <h2>SNS</h2>
      <div class="grid">
        <a class="card" href="https://x.com" target="_blank" rel="noopener">
          <span class="icon">🐦</span>
          X
          <span class="host">x.com</span>
        </a>
      </div>
    </section>
  </main>

  <footer>&copy; My Links</footer>
</body>
</html>
